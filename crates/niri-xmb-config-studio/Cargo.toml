[package]
name = "niri-xmb-config-studio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native editor for niri-xmb TOML"

[[bin]]
name = "niri-xmb-config-studio"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }
sha2 = "0.10"
toml_edit = "0.22"
