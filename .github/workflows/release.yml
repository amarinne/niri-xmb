name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag matches crate version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"niri-xmb".*"version":"\([^"]*\)".*/\1/p')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches crate version ${crate_version}"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libxkbcommon-dev
      - name: Test
        run: cargo test --locked --workspace
      - name: Package
        run: ./scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: niri-xmb-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: niri-xmb-linux-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
